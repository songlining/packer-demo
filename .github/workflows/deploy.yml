# Deploy on demand — presenter assigns the new version to the `production`
# channel in the HCP Packer UI (one click, demos the registry GUI), then runs
# this. The `production` GitHub environment is the approval gate (#22).
#
# Terraform runs remotely in HCP Terraform (workspace lab-larry/packer-demo).
# AWS auth happens there via dynamic credentials (OIDC) — this workflow only
# needs TFE_TOKEN to trigger and report the run.
name: deploy
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    env:
      TFE_TOKEN: ${{ secrets.TFE_TOKEN }} # HCP Terraform cloud backend auth
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3   # runners no longer ship terraform

      - name: Terraform apply
        run: |
          terraform -chdir=terraform init
          terraform -chdir=terraform apply -auto-approve
