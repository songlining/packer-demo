# One-off: create the `production` channel on base-os and assign the latest
# version, so webapp.pkr.hcl's datasource can resolve its parent. Delete after.
name: setup-channel
on:
  workflow_dispatch:

jobs:
  channel:
    runs-on: ubuntu-latest
    env:
      HCP_CLIENT_ID: ${{ secrets.HCP_CLIENT_ID }}
      HCP_CLIENT_SECRET: ${{ secrets.HCP_CLIENT_SECRET }}
    steps:
      - name: Create production channel and assign latest version
        run: |
          RESP=$(curl -s https://auth.idp.hashicorp.com/oauth2/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=$HCP_CLIENT_ID&client_secret=$HCP_CLIENT_SECRET&audience=https://api.hashicorp.cloud")
          echo "auth: $(echo "$RESP" | head -c 100)"
          TOKEN=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$TOKEN" ]; then echo "token fetch failed"; exit 1; fi

          TOKEN_PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="}1')
          CLAIMS=$(echo "$TOKEN_PAYLOAD" | base64 -d 2>/dev/null || true)
          echo "sub claim: $(echo "$CLAIMS" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sub',''))")"
          ORG=$(echo "$CLAIMS" | python3 -c "import json,sys,re; d=json.load(sys.stdin); m=re.search(r'@([0-9a-f-]{36})', d.get('sub','')); print(m.group(1) if m else '')")
          [ -z "$ORG" ] && { echo "claims: $CLAIMS" | head -c 400; exit 1; }
          PROJ_RESP=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.hashicorp.cloud/iam/2022-08-01/organizations/$ORG/projects")
          echo "projects raw (first 250): $(echo "$PROJ_RESP" | head -c 250)"
          PROJ=$(echo "$PROJ_RESP" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          ps=d.get('projects',[])
          p=[x for x in ps if x.get('name','')=='Default'] or ps
          print(p[0]['id'] if p else '')" 2>/dev/null || true)
          echo "org=$ORG project=$PROJ"
          [ -z "$PROJ" ] && { echo "no project found"; exit 1; }
          BASE="https://api.hashicorp.cloud/packer/2023-01-01/organizations/$ORG/projects/$PROJ/buckets/base-os"

          echo "=== versions ==="
          VERS=$(curl -s -H "Authorization: Bearer $TOKEN" "$BASE/versions")
          echo "$VERS" | head -c 300; echo
          FP=$(echo "$VERS" | python3 -c "
          import json,sys
          vs=json.load(sys.stdin).get('versions',[])
          vs.sort(key=lambda v: v.get('created_at',''), reverse=True)
          print(vs[0]['fingerprint'] if vs else '')")
          echo "latest fingerprint: $FP"

          echo "=== create channel ==="
          curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"production"}' "$BASE/channels" | head -c 200; echo

          echo "=== assign version ==="
          curl -s -X PUT -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"version_fingerprint\":\"$FP\"}" "$BASE/channels/production" | head -c 200; echo

          echo "=== verify ==="
          curl -s -H "Authorization: Bearer $TOKEN" "$BASE/channels/production" | head -c 200; echo
