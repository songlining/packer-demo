# PR gate — the "pre-deployment testing" story (#22, #14).
# Nothing merges until the templates and playbook pass.
name: validate
on:
  pull_request:
    paths: ['packer/**', 'terraform/**']

jobs:
  packer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all Packer templates (per-file; dir validate hits duplicate patch_level)
        working-directory: packer
        run: |
          packer init .
          for f in *.pkr.hcl; do
            [ "$f" = "plugins.pkr.hcl" ] && continue   # requirement-only file, no build block by design
            echo "::group::$f"
            packer validate "$f"
            echo "::endgroup::"
          done

      - name: Validate Ansible playbook
        run: |
          pip install --quiet ansible-core
          ansible-playbook --syntax-check packer/playbooks/webapp.yml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3   # runners no longer ship terraform

      - name: Terraform validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
