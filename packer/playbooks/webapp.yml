- hosts: all
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Deploy index page
      ansible.builtin.copy:
        content: "<h1>webapp-a from a golden image (20:10)</h1>\n"
        dest: /usr/share/nginx/html/index.html

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
